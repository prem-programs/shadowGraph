# One command:  docker compose up --build      then open http://localhost:8000
# FalkorDB's own browser UI is at http://localhost:3000 (connect to host "falkordb", port 6379 from inside,
# or localhost:6379 from your machine).
# Optional settings come from a .env file next to this one (copy .env.example). Nothing in it is required.

services:
  falkordb:
    image: falkordb/falkordb:latest
    network_mode: host
    environment:
      REDIS_ARGS: "--bind 0.0.0.0 --protected-mode no"
    volumes:
      - falkordb-data:/var/lib/falkordb/data
    healthcheck:
      test: ["CMD", "redis-cli", "-h", "127.0.0.1", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  app:
    build: .
    image: shadowgraph:latest
    network_mode: host
    depends_on:
      falkordb:
        condition: service_healthy
    environment:
      FALKORDB_URL: redis://127.0.0.1:6379
      PUBLIC_URL: ${PUBLIC_URL:-http://localhost:8000}
      DEFAULT_MODE: ${DEFAULT_MODE:-rules}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPO: ${GITHUB_REPO:-}
      GITHUB_WEBHOOK_SECRET: ${GITHUB_WEBHOOK_SECRET:-}
      PR_TOKEN_VERIFY: ${PR_TOKEN_VERIFY:-1}
      PR_SESSION_REFRESH: ${PR_SESSION_REFRESH:-2}
      PR_JWKS: ${PR_JWKS:-3}
      EMBED_BACKEND: ${EMBED_BACKEND:-auto}
      ADMIN_TOKEN: ${ADMIN_TOKEN:-}
      MCP_ALLOWED_HOSTS: ${MCP_ALLOWED_HOSTS:-}
      CORS_ORIGINS: ${CORS_ORIGINS:-*}
      # Home Assistant workspace (read-only). See docs/HOME_ASSISTANT.md
      TENANTS: ${TENANTS:-ha,acme,globex}
      HA_SOURCE: ${HA_SOURCE:-auto}
      HA_FEED: ${HA_FEED:-0}
      HA_FEED_INTERVAL: ${HA_FEED_INTERVAL:-180}
      HA_FEED_BATCH: ${HA_FEED_BATCH:-12}
      HA_CLONE: ${HA_CLONE_IN_CONTAINER:-}
    # To use a local clone of home-assistant/core instead of the GitHub API, mount it and set
    # HA_CLONE_IN_CONTAINER=/ha-core (and HA_SOURCE=git) in .env:
    # volumes:
    #   - /path/to/ha-core:/ha-core
    restart: unless-stopped

volumes:
  falkordb-data:
