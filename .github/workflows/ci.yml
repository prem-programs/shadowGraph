name: ci

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      falkordb:
        image: falkordb/falkordb:latest
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping" --health-interval 3s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r backend/requirements-dev.txt
      - name: Tests against a real FalkorDB
        working-directory: backend
        env:
          FALKORDB_URL: redis://localhost:6379
        run: python -m pytest -q

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t shadowgraph .
      - name: Smoke test the image with FalkorDB
        run: |
          docker network create sg
          docker run -d --name falkordb --network sg falkordb/falkordb:latest
          docker run -d --name app --network sg -p 8000:8000 -e FALKORDB_URL=redis://falkordb:6379 shadowgraph
          for i in $(seq 1 60); do curl -fs localhost:8000/api/health && break; sleep 2; done
          curl -fs -X POST localhost:8000/api/runs -H 'content-type: application/json' -d '{"tenant":"acme","pr_number":1}'
          sleep 5
          curl -fs "localhost:8000/api/runs?tenant=acme" | grep -q BLOCK
          docker logs app | tail -20
